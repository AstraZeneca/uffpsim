[build-system]
requires = [ "pybind11==2.12.0", "setuptools==69.5.1", "pkgconfig==1.5.5"]
build-backend = "setuptools.build_meta"

[project]
name = "uffpsim"
version = "0.1.0"
authors = [
    { name = "Rajendra Kumar" }
]
maintainers = [
    {name = "Rajendra Kumar"}
]
description = "Ultra-fast compound similarity search"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
    "rdkit>=2024.3.2",
    "numpy>=1.26.4",
    "scipy>=1.13",
]

[project.optional-dependencies]
web = [
    "Flask>=3.0,<4",
]

[project.scripts]
uffpsim = "uffpsim.cli:main"