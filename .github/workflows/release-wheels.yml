name: Build and Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64"
          CIBW_BEFORE_ALL_LINUX: >-
            /bin/bash -c "
            dnf install -y openssl-devel pkgconfig;
            dnf install -y epel-release;
            dnf install -y hdf5-devel hdf5;
            "
          CIBW_BEFORE_ALL_MACOS: >-
            /bin/bash -c "
            brew install hdf5 pkg-config libomp;
            HDF5_PREFIX=$(brew --prefix hdf5);
            LIBOMP_PREFIX=$(brew --prefix libomp);
            if [[ -z \"$HDF5_PREFIX\" || -z \"$LIBOMP_PREFIX\" ]]; then
              echo 'Could not resolve Homebrew prefixes for hdf5/libomp' >&2;
              exit 1;
            fi;
            ln -sfn \"$HDF5_PREFIX/include\" /tmp/cibw-hdf5-include;
            ln -sfn \"$HDF5_PREFIX/lib\" /tmp/cibw-hdf5-lib;
            ln -sfn \"$LIBOMP_PREFIX/include\" /tmp/cibw-omp-include;
            ln -sfn \"$LIBOMP_PREFIX/lib\" /tmp/cibw-omp-lib"
          CIBW_ENVIRONMENT_MACOS: >-
            CC=clang CXX=clang++ UFFPSIM_MACOS_OPENMP=1
            CPPFLAGS="-I/tmp/cibw-hdf5-include -I/tmp/cibw-omp-include"
            CFLAGS="-Xpreprocessor -fopenmp"
            CXXFLAGS="-Xpreprocessor -fopenmp"
            LDFLAGS="-L/tmp/cibw-hdf5-lib -L/tmp/cibw-omp-lib -lomp"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_release_assets:
    name: Upload wheels to release
    needs: build_wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: false

      - name: Upload wheels to GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/**/*.whl
