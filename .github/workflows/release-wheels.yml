name: Build and Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64"
          CIBW_BEFORE_ALL_LINUX: >-
            /bin/bash -c "
            dnf install -y openssl-devel pkgconfig;
            dnf install -y epel-release;
            dnf install -y hdf5-devel hdf5;
            "
          CIBW_BEFORE_ALL_MACOS: >-
            /bin/bash -c "
            brew install hdf5 pkg-config gcc;
            GXX_BIN=$(ls -1 /opt/homebrew/bin/g++-[0-9]* /usr/local/bin/g++-[0-9]* 2>/dev/null | sort -V | tail -n1);
            GCC_BIN=$(echo \"$GXX_BIN\" | sed 's/g++-/gcc-;')
            if [[ -z \"$GXX_BIN\" || ! -x \"$GXX_BIN\" || ! -x \"$GCC_BIN\" ]]; then
              echo 'Could not find Homebrew gcc/g++ versioned binaries' >&2;
              exit 1;
            fi;
            ln -sf \"$GCC_BIN\" /tmp/cibw-gcc;
            ln -sf \"$GXX_BIN\" /tmp/cibw-gxx"
          CIBW_ENVIRONMENT_MACOS: "CC=/tmp/cibw-gcc CXX=/tmp/cibw-gxx"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_release_assets:
    name: Upload wheels to release
    needs: build_wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: false

      - name: Upload wheels to GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/**/*.whl
