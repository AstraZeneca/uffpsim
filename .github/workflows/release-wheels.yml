name: Build and Release Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64"
          CIBW_BEFORE_ALL_LINUX: >-
            /bin/bash -c "
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y hdf5-devel openssl-devel pkgconfig pkgconf-pkg-config || dnf install -y hdf5-devel openssl-devel pkgconfig;
            elif command -v yum >/dev/null 2>&1; then
              yum install -y hdf5-devel openssl-devel pkgconfig;
            else
              echo 'No supported package manager found for Linux wheel image' >&2;
              exit 1;
            fi"
          CIBW_BEFORE_ALL_MACOS: "brew install hdf5 pkg-config"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_release_assets:
    name: Upload wheels to release
    needs: build_wheels
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: false

      - name: Upload wheels to GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/**/*.whl
