<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFFPSim Web App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <div class="page-shell">
        <header class="hero-panel container py-4 py-lg-5">
            <div class="hero-copy">
                <p class="eyebrow mb-2">Ultra-Fast Fingerprint Similarity Search</p>
                <h1 class="display-5 fw-semibold mb-3">UFFPSim Fingerprint Search</h1>
                <p class="lead mb-0">Batch-search SMILES against a preloaded HDF5 fingerprint database and retrieve compound IDs with similarity scores.</p>
            </div>
        </header>

        <main class="container pb-5">
            <div class="row g-4 align-items-start">
                <div class="col-12 col-xl-4">
                    <section class="panel-card mb-4">
                        <h2 class="h4 mb-3">Database info</h2>
                        <div id="db-info-panel">
                            <div class="small text-body-secondary">Start the server with --db-file /path/to/database.h5</div>
                        </div>
                    </section>
                </div>

                <div class="col-12 col-xl-8">
                    <section class="panel-card mb-4">
                        <h2 class="h4 mb-3">Batch search</h2>
                        <form id="search-form" class="row g-3">
                            <div class="col-md-6">
                                <label for="search-threshold" class="form-label">Similarity threshold</label>
                                <input id="search-threshold" class="form-control" type="number" min="0" max="1" step="0.01" value="0.6">
                            </div>
                            <div class="col-md-6">
                                <label for="search-limit" class="form-label">Hits per query</label>
                                <input id="search-limit" class="form-control" type="number" min="1" max="100" step="1" value="10">
                            </div>
                            <div class="col-12">
                                <label for="smiles-input" class="form-label">SMILES list</label>
                                <textarea id="smiles-input" class="form-control code-field" rows="8" placeholder="One SMILES string per line"></textarea>
                            </div>
                            <div class="col-12 d-flex gap-2 align-items-center">
                                <button id="search-button" class="btn btn-primary" type="submit">Search</button>
                                <span id="search-status" class="small text-body-secondary"></span>
                            </div>
                        </form>
                    </section>

                    <section class="panel-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h4 mb-0">Results</h2>
                            <div class="d-flex gap-2 align-items-center">
                                <span id="results-summary" class="small text-body-secondary"></span>
                                <button id="download-csv" class="btn btn-sm btn-outline-primary" style="display:none">Download CSV</button>
                            </div>
                        </div>
                        <div id="results-container" class="results-stack"></div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='vendor/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
